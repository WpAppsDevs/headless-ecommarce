name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_WP_URL: "${{ vars.NEXT_PUBLIC_WP_URL || 'https://api.najifasshop.com' }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reject tracked build artifacts
        run: |
          if git ls-files --error-unmatch tsconfig.tsbuildinfo >/dev/null 2>&1; then
            echo "::error::tsconfig.tsbuildinfo is tracked; remove it with git rm --cached and keep it in .gitignore."
            exit 1
          fi

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build
