name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read
  issues: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
      NEXT_PUBLIC_WP_URL: "${{ vars.NEXT_PUBLIC_WP_URL || 'https://api.najifasshop.com' }}"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Reject tracked build artifacts
        run: |
          if git ls-files --error-unmatch tsconfig.tsbuildinfo >/dev/null 2>&1; then
            echo "::error::tsconfig.tsbuildinfo is tracked; remove it with git rm --cached and keep it in .gitignore."
            exit 1
          fi

      - name: Verify
        run: npm run verify

      - name: Build
        run: npm run build

      - name: Route render check
        run: npm run check:routes

      - name: Production advisory gate
        run: npm run audit:prod

      # Runs only when the two repository secrets exist; without them every test
      # in the suite skips, so the job stays honest either way.
      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser tests behind the login
        env:
          E2E_EMAIL: ${{ secrets.E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.E2E_PASSWORD }}
        run: npm run test:e2e

  # Nothing tells anyone when a push to master breaks, since the repository has
  # no branch protection (GitHub Pro is required on a private repo). This files
  # one issue per red main and leaves it open until the suite is green again.
  report-main-failure:
    name: Report a red master
    needs: [verify]
    if: failure() && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - name: Open one issue while master is red
        uses: actions/github-script@v7
        with:
          script: |
            const label = 'ci-failure';
            const { data: open } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: label,
              per_page: 1,
            });
            if (open.length) {
              core.info(`Already tracked in #${open[0].number}`);
              return;
            }
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: 'CI is red on master',
              labels: [label],
              body: [
                `The suite failed on \`master\` at ${context.sha}.`,
                '',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                '',
                'Close this once `master` is green again.',
              ].join('\n'),
            });
